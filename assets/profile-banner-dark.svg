<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Inception Engine Systems by WholeTroutMedia: intelligence, cinema and spatial systems">
  <defs>
    <radialGradient id="glow" cx="78%" cy="38%" r="46%">
      <stop offset="0" stop-color="#eec566" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#eec566" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#fff3cf"/>
      <stop offset="0.45" stop-color="#eec566"/>
      <stop offset="1" stop-color="#a7741a"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#07080b" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#07080b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#07080b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="#07080b"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect width="1280" height="360" fill="url(#fade)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>

  <!-- orb with orbits -->
  <g transform="translate(1010 150)">
    <ellipse rx="132" ry="44" fill="none" stroke="#eec566" stroke-opacity="0.32" stroke-width="1" transform="rotate(-18)"/>
    <ellipse rx="168" ry="58" fill="none" stroke="#f6f1e6" stroke-opacity="0.12" stroke-width="1" transform="rotate(14)"/>
    <circle r="54" fill="url(#orb)"/>
    <circle r="54" fill="none" stroke="#fff3cf" stroke-opacity="0.35"/>
    <circle cx="126" cy="-40" r="4" fill="#eec566"/>
    <circle cx="-150" cy="34" r="3" fill="#f6f1e6" fill-opacity="0.7"/>
  </g>

  <!-- copy -->
  <text x="72" y="104" fill="#eec566" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="2.4">INCEPTION ENGINE SYSTEMS  ·  WHOLETROUTMEDIA</text>
  <text x="70" y="178" fill="#f6f1e6" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="62" letter-spacing="-1">Intelligence, cinema</text>
  <text x="70" y="240" fill="#f6f1e6" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="62" letter-spacing="-1">&amp; spatial systems.</text>
  <text x="72" y="292" fill="#f6f1e6" fill-opacity="0.62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19">An independent creative technology studio by Justin Aharoni · New York</text>

  <rect x="0.5" y="0.5" width="1279" height="359" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
