<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-label="WholeTroutMedia Open-Source Systems and Creative Engineering">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E12"/>
      <stop offset="55%" stop-color="#10161F"/>
      <stop offset="100%" stop-color="#080B0E"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <pattern id="tactileHairlineGrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#FFFFFF" stroke-width="0.6" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1200" height="200" rx="12" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5"/>
  <rect width="1200" height="200" rx="12" fill="url(#tactileHairlineGrid)"/>
  <rect x="55" y="0" width="220" height="2.5" fill="url(#goldAccent)"/>

  <g transform="translate(55, 34)">
    <rect x="0" y="0" width="7" height="7" rx="2" fill="#10B981"/>
    <text x="19" y="7.5" fill="#94A3B8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" letter-spacing="2">OPEN-SOURCE SYSTEMS &amp; CREATIVE ENGINEERING</text>
    <text x="1090" y="7.5" text-anchor="end" fill="#64748B" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.5">NEW YORK</text>
  </g>

  <line x1="55" y1="54" x2="1145" y2="54" stroke="#1E293B" stroke-width="1"/>

  <g transform="translate(55, 108)">
    <text x="0" y="0" fill="#F8FAFC" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="700" letter-spacing="-0.5">WholeTroutMedia</text>
    <text x="0" y="34" fill="#94A3B8" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15.5" font-weight="400">Verification utilities, zero-dependency creative and spatial tools, agent wire protocols, and upstream open-source engineering.</text>
    <text x="0" y="64" fill="#CBD5E1" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="500">JUSTIN AHARONI (@jaharoni)  ·  justinaharoni.com  ·  contact@jaharoni.com</text>
  </g>
</svg>
